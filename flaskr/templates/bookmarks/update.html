{% extends 'base.html' %}
{% block header %}
  <h1>{% block title %}Edit "{{ bookmark['title'] }}"{% endblock %}</h1>
{% endblock %}
{% block content %}
  <form method="post">
    <label for="title">Name</label>
    <input name="title" id="title"
      value="{{ request.form['title'] or bookmark['title'] }}" required>
    <label for="body">URL</label>
    <input name="body" id="body" type="url"
      value="{{ request.form['body'] or bookmark['body'] }}" required>
    <input type="submit" value="Save">
  </form>
  <hr>
  <form action="{{ url_for('bookmarks.delete', id=bookmark['id']) }}" method="post">
    <input class="danger" type="submit" value="Delete" onclick="return confirm('Are you sure?');">
  </form>
{% endblock %}
