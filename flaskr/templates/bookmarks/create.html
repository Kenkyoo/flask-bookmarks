{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}Nuevo Marcador{% endblock %}</h1>
{% endblock %}

{% block content %}
  <form method="post">
    <label for="url">Dirección Web (URL)</label>
    <input name="url" id="url" type="url" placeholder="https://ejemplo.com" required>

    <label for="body">Nota o Descripción</label>
    <textarea name="body" id="body">{{ request.form['body'] }}</textarea>

    <input type="submit" value="Guardar Marcador">
  </form>
{% endblock %}
